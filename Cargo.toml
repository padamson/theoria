[workspace]
# theoria is a Leptos library that enables no runtime of its own; its tests
# render it under `ssr` through leptotes, so the members resolve Leptos with
# the ssr backend.
members = [
    "crates/theoria",
    "crates/theoria-cli",
    "crates/theoria-macros",
]
# theoria-e2e drives a built gallery in a browser with playwright-rs. It
# stays out of the workspace, with its own lockfile and CI job, so
# workspace-wide commands stay native and fast.
exclude = ["crates/theoria-e2e"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padamson/theoria"
authors = ["Paul Adamson"]

[workspace.dependencies]
theoria-macros = { path = "crates/theoria-macros", version = "0.1.0" }

[workspace.lints.rust]
# Nothing here has a reason to reach for unsafe. `deny` (not `forbid`)
# leaves a targeted `#[allow(unsafe_code)]` escape hatch if a future FFI
# edge genuinely needs one.
unsafe_code = "deny"

# The policy the crates were written under in slp.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
