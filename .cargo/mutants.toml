# cargo-mutants configuration. Live from the first clone: CI runs
# `cargo mutants` regardless, and without this file the run is unscoped,
# uses `cargo test`, and tests only the mutated package.
# Docs: https://mutants.rs/config-file.html
#
# cargo-mutants reads `.cargo/mutants.toml` and nothing else. A config at
# the repo root (`.mutants.toml`) is ignored silently: no warning, not
# even a parse error for invalid TOML. Verify a change is live with a
# filter that should visibly shrink `cargo mutants --list`.

# nextest stops at the first failing test per mutant, so it is faster,
# and it reports timeouts the same way the test job does.
test_tool = "nextest"

# Run the whole workspace's tests against each mutant, not just the
# mutated package's. By default cargo-mutants runs only the mutated
# package's tests, so a mutant whose killing test lives in another crate
# survives silently. Don't add `--lib` to `additional_cargo_test_args`
# for speed either: it skips `tests/` integration targets, even in a
# single-crate project.
test_workspace = true

# Scope slow tests with a nextest filterset instead. This keeps every
# target in the run and drops only the tests you name, e.g. e2e and
# browser suites that no mutant in a logic crate can fail:
# additional_cargo_test_args = ["-E", "not test(/e2e|slow/)"]

# All three crates. A macro mutant that breaks the code theoria's own
# `#[story]` tests compile is reported unviable, not caught: the workspace
# build fails before any test runs.
examine_globs = [
    "crates/theoria/src/**/*.rs",
    "crates/theoria-cli/src/**/*.rs",
    "crates/theoria-macros/src/**/*.rs",
]

# theoria's own stories are the e2e gallery's fixtures: theoria-e2e opens
# every one in a browser, and no native test reads a story list.
exclude_globs = ["crates/theoria/src/**/*.stories.rs"]

# Every exclude carries its equivalence argument next to it.
exclude_re = [
    # theoria-cli `main` and `trunk`: the binary's call to `run`, and
    # shelling out to `trunk`. theoria-e2e exercises them end to end by
    # building the gallery through the CLI; no native test can.
    'replace main -> std::process::ExitCode',
    'replace trunk -> Result',
    'delete ! in trunk',
    # theoria-macros `story`: the proc_macro to proc_macro2 adapter, which
    # cannot be called outside a proc-macro context. The logic is in
    # `story_impl`, which the tests cover.
    'replace story -> TokenStream with Default::default\(\)',
    # theoria `Stories::mount` and the panic hook it sets, behind `csr` and
    # wasm32, which the native test build never compiles. theoria-e2e
    # mounts every gallery it opens through them, and its panic fixture
    # reads the hook's console error.
    'replace Stories::mount with \(\)',
    'replace log_to_console with \(\)',
    'replace stack_with_frames -> String',
    # theoria's own story list (`components::stories`), as the stories files.
    'components/mod.rs:.*replace stories -> crate::Stories',
    # theoria's browser-only code, which theoria-e2e drives in Chromium.
    # A click's modifier keys and the control handlers' reads of the event
    # and of the swatch's computed color run only in an `on:` handler, which
    # a leptotes render never fires. Writing the URL and `localStorage` runs
    # only in an `Effect`, which `ssr` does not run, and is a no-op without
    # `csr`.
    'components/story_nav.rs:.*replace Modifiers::of -> Self',
    'components/controls.rs:.*replace (parse|computed_background) -> ',
    'components/controls.rs:.*replace show with \(\)',
    # Writing the clipboard runs only in the Copy button's `on:click`, and is
    # a no-op without `csr`, so no native test reaches anything in `copy`.
    # theoria-e2e reads the clipboard after a click and checks what Copy says
    # with the clipboard there, refusing, and missing.
    'components/controls.rs:.*(replace copy with \(\)|in copy)$',
    'components/gallery.rs:.*replace (show_in_url|replace_url|save_selected) with \(\)',
    'components/gallery.rs:.*replace storage -> ',
    # Reading them is equivalent without `csr`: `story_in_url` and
    # `location` are `None` there already, and the other values these
    # mutants give `location` and `load_selected` name no story (no `story`
    # key in the query, no story called "" or "xyzzy"), which opens the
    # first story, as `None` does. The other `story_in_url` mutants name a
    # missing story, which the gallery tests catch.
    'components/gallery.rs:.*replace story_in_url -> Option<String> with None',
    'components/gallery.rs:.*replace location -> ',
    'components/gallery.rs:.*replace load_selected -> ',
]
