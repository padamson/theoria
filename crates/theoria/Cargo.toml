[package]
name = "theoria"
description = "A component explorer (gallery) for Leptos — preview components in isolation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["gui", "development-tools", "wasm"]
keywords = ["leptos", "storybook", "components", "gallery"]

[dependencies]
leptos = { version = "0.8", default-features = false }
# The `#[story]` macro (re-exported as `theoria::story`).
theoria-macros = { workspace = true }
# Render story descriptions (component doc-comments) as Markdown for autodocs.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The `?story=` query in a story's URL, read and written the same way.
form_urlencoded = "1"
# Only for the gallery's localStorage and URL (the selected story across reloads
# and links), and the console that `Stories::mount`'s panic hook logs to;
# pulled in by the csr feature, so ssr/leptotes builds don't see it.
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage", "Location", "History", "Navigator", "Clipboard", "console"] }
# The JavaScript stack that the panic hook adds to what it logs.
js-sys = { version = "0.3", optional = true }
# Waits on the clipboard write, to say whether Copy landed.
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
csr = ["leptos/csr", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
# Compiles the colocated `*.stories.rs` files (theoria's own components as
# fixtures). Off in production-style builds, on for the demo/gallery.
stories = []

# theoria's own UI is component-driven and TDD'd with leptotes (rendered under ssr).
[dev-dependencies]
leptotes = { git = "https://github.com/padamson/leptotes", branch = "main" }

[lints]
workspace = true
