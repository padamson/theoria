name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  skill-version:
    name: Skill version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The pre-commit hook of the same name is per-clone and opt-in, so a
    # hookless clone or a `--no-verify` commit would ship a skill edit
    # without the version bump installed consumers key their updates on.
    # Same script, run against the PR base or the tip before the push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      # The script treats an unusable ref as an error; skipping when there
      # is nothing to compare against is this job's call, not the script's.
      - name: Check the skill version against the base
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No reachable base (first push, manual run, or rewritten history); nothing to compare."
            exit 0
          fi
          scripts/check-skill-version-bumped.sh --base "$BASE"

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      - name: Check compilation on MSRV
        run: cargo check --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # theoria-e2e is outside the workspace, so the step above skips it.
      - name: Run clippy (theoria-e2e)
        run: cargo clippy --manifest-path crates/theoria-e2e/Cargo.toml --all-targets -- -D warnings

      # nextest does not run doctests, so this is its own step. The
      # crate keeps at least one doctest (`Story::new` in theoria has one),
      # which is what makes this step honest; delete the step if the
      # crate ever has none rather than running a no-op. The guard is on
      # the library target, not on doctests: `cargo test --doc` errors
      # outright on a bin-only crate, so the step goes with `src/lib.rs`.
      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # nextest's slow-timeout catches a hung test; this catches a hung
    # runner or a wedged tool install.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test

      # Every install-action step sets `fallback: none`. The default,
      # `cargo-binstall`, checks no checksum, and it quietly installs a
      # tool missing from the action's manifest instead of failing. If a
      # step fails as "not supported", install that tool with `cargo
      # install --locked` (and `--force` after a cache step that restores
      # `~/.cargo/bin`) rather than delete the line.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest
          fallback: none

      - name: Build
        run: cargo build --verbose

      # `--profile ci` (.config/nextest.toml): retries on, so a retried
      # pass is reported FLAKY instead of hiding, and a longer slow-timeout.
      - name: Run tests
        run: cargo nextest run --workspace --profile ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # theoria's own dogfood gate: build a gallery from theoria's components
    # through theoria-cli and Trunk, then drive it in Chromium with
    # playwright-rs. This is the only check on the Leptos view code and on
    # the CLI's build path, both out of mutation testing's reach.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: e2e
          workspaces: |
            .
            crates/theoria-e2e

      - name: Install Trunk and cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: trunk,cargo-nextest
          fallback: none

      - name: Build the gallery
        run: cargo run --locked -p theoria-cli -- build --config theoria-e2e.toml

      # The tests pass without running when the gallery is missing (they
      # print "skipping" and return), so a build that put it anywhere else
      # would turn this job green with no browser check run.
      - name: Check the gallery was built
        run: test -f target/theoria/gallery/theoria/dist/index.html

      # The version must match the PLAYWRIGHT_VERSION of the playwright-rs
      # revision in crates/theoria-e2e/Cargo.lock; nothing checks it.
      - name: Install Playwright browsers
        run: npx playwright@1.64.1 install --with-deps chromium

      # Under nextest so the slow-timeout in .config/nextest.toml applies.
      # The e2e crate is its own workspace root, so the config is named.
      - name: Run e2e
        run: cargo nextest run --locked --manifest-path crates/theoria-e2e/Cargo.toml --config-file .config/nextest.toml --profile ci
