name: Security & Quality

# The jobs are shared workflows in padamson/rust-ci-workflows, pinned by SHA
# so Dependabot's github-actions entry moves them. Each check reports as
# `<job id here> / <job name there>`, the names branch protection requires
# (`scripts/github-settings.sh`). The local half (deny.toml, supply-chain/,
# .cargo/mutants.toml, the prek hooks) stays in this repo, and release.yml
# calls the same `supply-chain.yml` at the same pin on a release tag.
#
# A job only this repo needs goes here beside the calls. If one ever needs
# a tool built from a git branch (a fork, or a producer's `main` you are
# dogfooding), resolve the branch to a SHA in one step and install by
# `--rev` in the next. Never `--branch`: the branch can move between the
# resolve and the build, and the cargo cache then holds a binary nobody can
# trace to a commit. `--locked` keeps the tool's own lockfile, `--force`
# replaces a cached binary.
#
#   - name: Resolve tool revision
#     id: tool
#     run: echo "rev=$(git ls-remote https://github.com/OWNER/TOOL.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
#   - name: Install tool
#     run: cargo install --locked --force --git https://github.com/OWNER/TOOL.git --rev ${{ steps.tool.outputs.rev }} TOOL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Saturday 5am ET
    - cron: '0 9 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # cargo deny (bans, licenses, sources), cargo-lockpatrol's advisory check
  # over every tracked Cargo.lock against deny.toml's ignore list, and cargo
  # vet. crates/theoria-e2e is excluded from the workspace and keeps its own
  # lockfile, so deny checks it separately; vet covers the workspace only.
  supply-chain:
    uses: padamson/rust-ci-workflows/.github/workflows/supply-chain.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
    with:
      deny-manifests: crates/theoria-e2e

  # Not a required check: the early warning for release.yml's semver gate,
  # and on 0.x a deliberate break turns it red until the release that bumps
  # the version (SETUP.md, "Branch protection"). It builds the tree, so a
  # stub the `mutation` call's `setup` needs goes in a `setup` here too.
  semver-preview:
    uses: padamson/rust-ci-workflows/.github/workflows/semver-preview.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0

  # The per-diff run on push and pull request, the full sweep on dispatch.
  # The full sweep outgrows a job's timeout, so the schedule skips it. CI
  # does not run `scripts/mutants.sh`: its pre-setup stubs go in `with:
  # setup:` here.
  mutation:
    if: github.event_name != 'schedule'
    uses: padamson/rust-ci-workflows/.github/workflows/mutation.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
